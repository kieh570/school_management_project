        <div class="container" style="margin-top: 6rem;">
             <h2 class="text-center col-12 col-12 col-12" style="font-weight: 800;">Student Login</h2>
            <div class="row">
                
                    <div class="col-12 col-md-6 col-lg-6">

                         <form action="students_login.html" method="POST" class="form-control shadow-lg" style="min-height: 10vh; margin-top: 6rem;">
                                <label for="id"  class="form-label mt-3"style="margin-left: 2.5%;"><b>ID No.</b></label>
                                <input type="text" name="id" placeholder="ID Number"  class="p-3 form-control" style="width: 90%;
                                    border-radius: 10px; border: 1px solid #ddd; margin-left: 2.5%; margin-right: 2.5%;">

                                    <label for="password"  class="form-label mt-3"style="margin-left: 2.5%;"><b>Password</b></label>
                                <input type="password" name="password" placeholder="Type Password"  class="p-3 form-control" style="width: 90%;
                                border-radius: 10px; border: 1px solid #ddd; margin-left: 2.5%; margin-right: 2.5%;">


                   

                                    <!--Teacher Login Button-->
                        <div style="margin-top:25px; margin-bottom: 10px;">
                            <button class="btn" type="submit" style="background-color: blue; color: white; 
                            border-radius: 6px; border: none; font-weight: 800;
                            margin-left: 2%;">Login</button> <button class="btn" type="reset" style="background-color: red;
                            color: white; border-radius: 6px; border: none; font-weight: 800; margin-left: 10px;">Reset</button>
                        </div>

                        </form>
                    </div>
